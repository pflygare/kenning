name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Docker Hub rate-limits shared runners; this is the same official image.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: kenning
          POSTGRES_PASSWORD: kenning
          POSTGRES_DB: kenning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kenning"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kenning:kenning@localhost:5432/kenning
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check generated TypeScript types are committed
        run: |
          if [ -n "$(git status --porcelain -- ../frontend/src/api/types)" ]; then
            git status --porcelain -- ../frontend/src/api/types
            echo "::error::API types changed. Run 'cargo test' in backend/ and commit frontend/src/api/types."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
